# Environment export of the conda env the paper's implementation ran in
#
# U-Mamba — which vendors nnU-Net v2.1.1 and is NOT captured below because it
# was installed in editable mode — must be installed separately, in editable
# mode, from git commit 28459e33ca03769800dd35e23c6e62491d1925b5 of
# https://github.com/bowang-lab/U-Mamba :
#
#     git clone https://github.com/bowang-lab/U-Mamba
#     cd U-Mamba && git checkout 28459e33ca03769800dd35e23c6e62491d1925b5
#     pip install -e umamba/
#
# The campaign ran torch 2.10.0+cu128; the pip section
# below records torch==2.10.0 with the cu128 builds of torchvision/torchaudio.
